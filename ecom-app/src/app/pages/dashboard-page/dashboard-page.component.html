<header><app-customer-navbar (searchEvent)="onSearch($event)"></app-customer-navbar></header>


<!-- Success Message -->
<div *ngIf="successMessage" class="alert alert-success" role="alert">
  {{ successMessage }}
</div>

<!-- Error Message -->
<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<div class="container mt-4">
 
  <!-- Rest of your component's HTML -->
  
  <div class="row row-cols-1 row-cols-md-4 g-4">
    <!-- Loop through all products -->
    <div class="col" *ngFor="let product of products">
      <div class="card card-custom" style="border: 1px solid rgb(200, 200, 200);">
        <!-- Display Product Image -->
        <div class="carousel-item active" *ngFor="let i of product.images">
          <img [src]="i.path" class="d-block w-100" alt="{{ product.name }}" style="height: 200px;">
        </div>
        <div class="card-body">
          <!-- Product Title and Details -->
          <h5 class="card-title" style="color: rgb(0, 0, 0);">{{ product.name }}</h5>

          <!-- Description: Check if the product description exists
          <p class="card-text" style="color: rgb(0, 0, 0);">
            <strong>Description:</strong> {{ product.description || 'No description available' }}
          </p>
           -->
          <p class="card-text" style="color: rgb(0, 0, 0);">Price: Rs.{{ product.price }}</p>

          <!-- Buttons Section -->
          <div class="d-flex justify-content-between align-items-center">
            <!-- View Details Button -->
            <button class="btn btn-lg" [routerLink]="['/product', product.id]" 
                    style="background-color: rgb(141, 68, 219); color: white;">View Details
            </button>

            <!-- Wishlist Button with Heart Icon -->
            <button class="btn btn-outline-danger" (click)="addToWishlist(product)">
              <i class="fa fa-heart"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>



<div class = "mt-4">
  <nav aria-label="Page navigation example">
      <ul class="pagination justify-content-center">
        <li class="page-item">
          <button class="page-link" (click)="prev()"  tabindex="-1" aria-disabled="true">Previous</button>
        </li>
        <li class="page-item" *ngFor="let i of pageArray">
              <button class="page-link" (click)="onClick(i-1)" >{{i}}</button>
          </li>
         
        <li class="page-item">
          <button class="page-link"  (click)="next()">Next</button>
        </li>
      </ul>
    </nav>
</div>
