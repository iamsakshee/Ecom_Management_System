<header><app-customer-navbar></app-customer-navbar></header>

<!-- Product Cards Section -->
<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <!-- Loop through all products -->
    <div class="col" *ngFor="let product of products">
      <div class="card card-custom" style="border: 1px solid rgb(200, 200, 200);">
        <!-- Display Product Image -->
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="{{ product.name }}">
        <div class="card-body">
          <!-- Product Title and Details -->
          <h5 class="card-title" style="color: rgb(0, 0, 0);">{{ product.name }}</h5>
          <p class="card-text" style="color: rgb(0, 0, 0);">{{ product.description }}</p>
          <p class="card-text" style="color: rgb(0, 0, 0);">Price: Rs.{{ product.price }}</p>

          <!-- Buttons Section -->
          <div class="d-flex justify-content-between align-items-center">
            <!-- View Details Button -->
            <button class="btn btn-lg" [routerLink]="['/product', product.id]" 
                    style="background-color: rgb(141, 68, 219); color: white;">View Details
            </button>

            <!-- Wishlist Button with Heart Icon -->
            <button class="btn btn-outline-danger" (click)="addToWishlist(product)">
              <i class="fa fa-heart"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
