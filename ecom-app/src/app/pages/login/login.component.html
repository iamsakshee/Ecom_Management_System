<link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

<style>
  .image-container {
    height: 200px; /* You can adjust the height as per your design */
    overflow: hidden; /* Hide overflow to prevent image spilling out of container */
  }

  .image-container img {
    object-fit: cover;
    width: 100%;
    height: 100%;
  }
</style>

<section class="bg-light p-3 p-md-4 p-xl-5 center-page">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-xxl-11">
        <div class="card border-light-subtle shadow-sm">
          <div class="row g-0">
            <div class="col-12 col-md-6">
              <img class="img-fluid rounded-start w-100 h-100 object-fit-cover" loading="eager"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbe3H9LNZVfHwhgRlhNDZ0E_bGsNpCuwaYrg&s"
                alt="Welcome customer!" />
            </div>
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
              <div class="col-12 col-lg-11 col-xl-10">
                <div class="card-body p-3 p-md-4 p-xl-5">
                  <div class="row">
                    <div class="col-12">
                      <p class="text-center mt-4 mb-5" style="
                          font-size: x-large;
                          font-family: 'Times New Roman', Times, serif;
                          color: black;
                          font-weight: lighter;
                        ">
                        Login
                      </p>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="alert alert-primary mb-4" *ngIf="successMsg">
                      {{ successMsg }}
                    </div>
                    <div class="alert alert-danger mb-4" *ngIf="errorMsg">
                      {{ errorMsg }}
                    </div>
                    <div class="alert alert-danger mb-4" *ngIf="msg">
                      {{ msg }}
                    </div>
                    <form action="#!">
                      <div class="row gy-3 overflow-hidden">
                        <div class="col-12">
                          <div class="form-floating mb-3">
                            <input type="name" class="form-control" name="username" id="username" [(ngModel)]="username"
                              required />
                            <label for="email" class="form-label" style="color: rgb(116, 116, 116)">Enter
                              Username</label>
                          </div>
                        </div>
                        <div class="col-12">
                          <div class="form-floating mb-3">
                            <input type="password" class="form-control" name="password" id="password"
                              [(ngModel)]="password" required />
                            <label for="password" class="form-label" style="color: rgb(116, 116, 116)">Enter
                              Password</label>
                          </div>
                        </div>

                        <div class="col-12">
                          <div class="d-grid">
                            <button class="btn btn-dark btn-lg" type="submit" style="
                                background-color: rgba(141, 68, 219, 1);
                                border-color: white;
                              " (click)="onLogin()">
                              Log in
                            </button>
                          </div>
                        </div>
                      </div>
                    </form>
                    <div class="row">
                      <div class="col-12">
                        <div class="d-flex gap-2 gap-md-4 flex-column flex-md-row justify-content-md-center mt-5">
                          <div class="text-end">
                            <button type="button" class="btn btn-secondary me-2" style="
                                background-color: white;
                                color: grey;
                                border: 0cap;
                              " (click)="navigateToSignUp()">
                              Create New User
                            </button>
                            <button type="button" class="btn btn-secondary me-2" style="
                                background-color: white;
                                color: grey;
                                border: 0cap;
                              " (click)="navigateToForgotPassword()">
                              Forgot Password?
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
