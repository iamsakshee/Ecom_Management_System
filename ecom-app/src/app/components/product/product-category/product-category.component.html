<header>
  <app-customer-navbar></app-customer-navbar>
</header>

<div class="container mt-4">
  <div *ngIf="products.length; else noProducts">
    <div class="row">
      <div class="col-md-4 mt-4" *ngFor="let product of products">
        <div class="card mb-4 mt-4">
          <!-- Product Image -->
          <img [src]="product.images[0]?.path || 'https://via.placeholder.com/300x200'" 
               class="img-fluid rounded mx-auto d-block" alt="{{ product.name }}">

          <div class="card-body mt-4">
            <!-- Product Title -->
            <h5 class="card-title">{{ product.name }}</h5>

            <!-- Product Description -->
            <p class="card-text"><strong>Description:</strong> {{ product.description }}</p>

            <!-- Product Price -->
            <p class="card-text"><strong>Price:</strong> Rs.{{ product.price }}</p>

            <!-- Buttons -->
            <div class="d-grid gap-2 mt-4">
              <!-- View Details Button -->
              <button class="btn btn-lg btn-custom" 
                      [routerLink]="['/product', product.id]">View Details</button>

              <!-- Add to Cart Button -->
              <button class="btn btn-lg btn-custom" 
                      (click)="addToCart(product)">Add to Cart</button>

              <!-- Add Review Button -->
              <button class="btn btn-lg btn-custom" 
                      (click)="openReviewModal()">Add Review</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Adding Reviews -->
  <div class="modal" tabindex="-1" role="dialog" *ngIf="showModal" 
       style="display: block; background-color: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Your Review</h5>
          <button type="button" class="close" (click)="closeReviewModal()">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="rating">Rating (1-5)</label>
            <input type="number" id="rating" [(ngModel)]="rating" name="rating" 
                   class="form-control" min="1" max="5" required />
          </div>
          <div class="form-group">
            <label for="reviewText">Review</label>
            <textarea id="reviewText" [(ngModel)]="reviewText" name="reviewText" 
                      class="form-control" rows="4" required></textarea>
          </div>
          <!-- Displaying Success/Error Messages -->
          <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" 
                  (click)="closeReviewModal()">Close</button>
          <button type="button" class="btn btn-custom" 
                  (click)="submitReview()" [disabled]="!rating || !reviewText">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noProducts>
    <p>No products available for this category.</p>
  </ng-template>
</div>

<style>
  .btn-custom {
    background-color: rgb(141, 68, 219);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 16px;
  }
  .btn-custom:hover {
    background-color: rgb(121, 50, 200);
    color: white;
  }
  .btn {
    width: 100%;
  }
</style>
