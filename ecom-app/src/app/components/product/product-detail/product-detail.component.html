<header><app-customer-navbar></app-customer-navbar></header>

<div class="container mt-4">
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-lg-8" *ngIf="product">
            <div class="col-md-6">
                <!-- Product Image -->
                <img [src]="product.images[0]?.path || 'https://via.placeholder.com/300x200'" class="img-fluid rounded mx-auto d-block"
                    alt="{{ product.name }}">
            </div>
            <div class="col-md-6">
                <div> <!-- Product Title -->
                    <h2 class="text-center" style="color: rgb(0, 0, 0); font-weight: bold;">{{ product.name }}</h2>
                    <!-- Product Description -->
                    <div class="mt-3">
                        <p><strong>Description:</strong> {{ product.description }}</p>
                        <p><strong>Price:</strong> Rs.{{ product.price }}</p>
                    </div>
                    <!-- Quantity Selection and Buy Now Button -->
                    <div class="form-group mt-4">
                        <label for="quantity" class="font-weight-bold">Quantity</label>
                        <input type="number" id="quantity" [(ngModel)]="product.quantity"
                            class="form-control form-control-sm" min="1" [max]="product.stock"
                            style="border-radius: 5px; border: 1px solid rgb(141, 68, 219);" />
                    </div>
                    <div class="d-flex justify-content-center mt-4">
                        <button class="btn btn-lg" style="background-color: rgb(141, 68, 219); color: white;"
                            (click)="addToCart()">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
