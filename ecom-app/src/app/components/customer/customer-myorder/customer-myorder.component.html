<header><app-customer-navbar></app-customer-navbar></header>

<div class =row>
  <div class="col-sm-3"></div>
  <div class="col-sm-6"><div *ngIf="orders.length > 0; else noOrders">
    <div class="order-cards-container">
      <div *ngFor="let order of orders" class="order-card">
        <div class="order-card-header">
          <h4>Order ID: {{ order.order_id }}</h4>
        </div>
        <div class="order-card-body">
          <div><strong>Product Name:</strong> {{ order.product_name }}</div>
          <div><strong>Order Quantity:</strong> {{ order.order_quantity }}</div>
          <div><strong>Order Status:</strong> {{ order.order_status }}</div>
          <div><strong>Date of Purchase:</strong> {{ order.date_of_purchase }}</div>
        </div>
      </div>
    </div>
  </div></div>
  <div class="col-sm-3"></div>
</div>





<ng-template #noOrders>
  <p>No orders found for this customer.</p>
</ng-template>
