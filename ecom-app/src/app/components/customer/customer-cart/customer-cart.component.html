<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Custom Styles -->
    <style>
        
        body {
            
            color: black;
            font-family: Arial, sans-serif;
        }

        .card {
        
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(153, 22, 189, 0.5);
        }

        h2, h4, h5 {
            color: #8D44DB;
        }

        .table {
            color: white;
        }

        .table thead {
            background-color: #8D44DB;
        }

        .table thead th {
            color: white;
            text-transform: uppercase;
        }

        .table tbody td {
            color: #8D44DB;
            font-weight: bold;
        }

        .media-heading a {
            color: #8D44DB;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-primary,
        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #8D44DB;
            border-color: #8D44DB;
        }

        .btn-success {
            background-color: #8D44DB;
            border-color: #8D44DB;
        }

        .icon-btn {
            background-color: transparent;
            border: none;
            color: #E74C3C;
            font-size: 24px;
            cursor: pointer;
        }

        .icon-btn:hover {
            color: #ff4c4c;
        }
    </style>
</head>

<body>

    <div class="container-fluid mt-5" >
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <h2 class="text-center mb-4">Shopping Cart</h2>
                    <table class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th class="text-center">Price</th>
                                <th class="text-center">Total</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Product Row 1 -->
                            <tr>
                                <td class="col-md-5">
                                    <div class="d-flex align-items-center">
                                        <img src="http://icons.iconarchive.com/icons/custom-icon-design/flatastic-2/72/product-icon.png" 
                                             style="width: 100px; height: 100px;" class="me-3 rounded">
                                        <div>
                                            <h4><a href="#">Product name</a></h4>
                                            <h5>by <a href="#">Brand name</a></h5>
                                            <span>Status: <span class="text-success">In Stock</span></span>
                                        </div>
                                    </div>
                                </td>
                                <td class="col-md-2">
                                    <input type="number" class="form-control text-center" value="3" min="1">
                                </td>
                                <td class="col-md-2 text-center"><strong>$4.87</strong></td>
                                <td class="col-md-2 text-center"><strong>$14.61</strong></td>
                                <td class="col-md-1 text-center">
                                    <button class="icon-btn" title="Remove Item">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>

                            <!-- Product Row 2 -->
                            <tr>
                                <td class="col-md-5">
                                    <div class="d-flex align-items-center">
                                        <img src="http://icons.iconarchive.com/icons/custom-icon-design/flatastic-2/72/product-icon.png" 
                                             style="width: 100px; height: 100px;" class="me-3 rounded">
                                        <div>
                                            <h4><a href="#">Product name</a></h4>
                                            <h5>by <a href="#">Brand name</a></h5>
                                            <span>Status: <span class="text-warning">Ships in 2-3 weeks</span></span>
                                        </div>
                                    </div>
                                </td>
                                <td class="col-md-2">
                                    <input type="number" class="form-control text-center" value="2" min="1">
                                </td>
                                <td class="col-md-2 text-center"><strong>$4.99</strong></td>
                                <td class="col-md-2 text-center"><strong>$9.98</strong></td>
                                <td class="col-md-1 text-center">
                                    <button class="icon-btn" title="Remove Item">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>

                            <!-- Subtotal Row -->
                            <tr>
                                <td colspan="3"></td>
                                <td class="text-end"><h5>Subtotal</h5></td>
                                <td class="text-end"><h5><strong>$24.59</strong></h5></td>
                            </tr>

                            <!-- Shipping Row -->
                            <tr>
                                <td colspan="3"></td>
                                <td class="text-end"><h5>GST charges</h5></td>
                                <td class="text-end"><h5><strong>$6.94</strong></h5></td>
                            </tr>

                            <!-- Total Row -->
                            <tr>
                                <td colspan="3"></td>
                                <td class="text-end"><h4>Total</h4></td>
                                <td class="text-end"><h4><strong>$31.53</strong></h4></td>
                            </tr>

                            <!-- Action Buttons -->
                            <tr>
                                <td colspan="3"></td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-primary">
                                        Continue Shopping
                                    </button>
                                </td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-success">
                                        Checkout
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Icons CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/bootstrap-icons.min.js"></script>
    
</body>

</html>
