<app-customer-navbar></app-customer-navbar>

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <h2 class="text-center mb-4">Shopping Cart</h2>
                <table class="table table-hover w-100">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th class="text-center">Price</th>
                            <th class="text-center">Total</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of cart">
                            <td class="col-md-5">
                                <div class="d-flex align-items-center">
                                    <img [src]="item.image" style="width: 100px; height: 100px;" class="me-3 rounded">
                                    <div>
                                        <h4><a href="#">{{ item.name }}</a></h4>
                                        <h5>by <a href="#">Brand name</a></h5>
                                        <span>Status: <span class="text-success">In Stock</span></span>
                                    </div>
                                </div>
                            </td>
                            <td class="col-md-2">
                                <input type="number" class="form-control text-center" [(ngModel)]="item.quantity" min="1" (ngModelChange)="updateItemTotal(item)">
                            </td>
                            <td class="col-md-2 text-center"><strong>Rs.{{ item.price }}</strong></td>
                            <td class="col-md-2 text-center"><strong>Rs.{{ item.total }}</strong></td>
                            <td class="col-md-1 text-center">
                                <button class="icon-btn" (click)="removeItem(item.productId)" title="Remove Item">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h5>Subtotal</h5></td>
                            <td class="text-end"><h5><strong>Rs.{{ totalAmount }}</strong></h5></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h5>GST charges</h5></td>
                            <td class="text-end"><h5><strong>Rs.{{ totalAmount * 0.18 }}</strong></h5></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h4>Total</h4></td>
                            <td class="text-end"><h4><strong>Rs.{{ totalAmount + (totalAmount * 0.18) }}</strong></h4></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end">
                                <button type="button" class="btn btn-primary" (click)="continueShopping()">Continue Shopping</button>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-success">Checkout</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
