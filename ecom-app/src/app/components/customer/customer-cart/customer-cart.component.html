<app-customer-navbar></app-customer-navbar>

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <h2 class="text-center mb-4" style="font-family: 'Arial', sans-serif; color: rgba(141, 68, 219, 1);">Shopping Cart</h2>
                <table class="table table-hover w-100">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-center">Price</th>
                            <th class="text-center">Total</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of cart">
                            <td class="col-md-5">
                                <div class="d-flex align-items-center">
                                    <img [src]="item.image" style="width: 100px; height: 100px;" class="me-3 rounded">
                                    <div>
                                        <h4><a href="#" style="font-family: 'Arial', sans-serif; color: rgba(141, 68, 219, 1);">{{ item.name }}</a></h4>
                                        <h5>by <a href="#" style="color: rgba(141, 68, 219, 1);">Brand name</a></h5>
                                        <span>Status: <span class="text-success">In Stock</span></span>
                                    </div>
                                </div>
                            </td>
                            <td class="col-md-2">
                                <div class="d-flex justify-content-center align-items-center">
                                    <span>     </span>
                                    <div class="d-flex align-items-center ms-3">
                                        <button class="btn btn-lg" (click)="updateQuantity(item, -1)">-</button>
                                        <input type="number" [(ngModel)]="item.quantity" class="form-control text-center mx-2" min="1" (ngModelChange)="updateItemTotal(item)" style="width: 80px; font-size: 16px;">
                                        <button class="btn btn-lg" (click)="updateQuantity(item, 1)">+</button>
                                    </div>
                                </div>
                            </td>
                            <td class="col-md-2 text-center"><strong>Rs.{{ item.price }}</strong></td>
                            <td class="col-md-2 text-center"><strong>Rs.{{ item.total }}</strong></td>
                            <td class="col-md-1 text-center">
                                <button class="icon-btn" (click)="removeItem(item.productId)" title="Remove Item">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h5>Subtotal</h5></td>
                            <td class="text-end"><h5><strong>Rs.{{ subtotal }}</strong></h5></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h5>GST charges</h5></td>
                            <td class="text-end"><h5><strong>Rs.{{ gst }}</strong></h5></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end"><h4>Total</h4></td>
                            <td class="text-end"><h4><strong>Rs.{{ total }}</strong></h4></td>
                        </tr>

                        <tr>
                            <td colspan="3"></td>
                            <td class="text-end">
                                <button type="button" class="btn btn-primary" (click)="continueShopping()">Continue Shopping</button>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn btn-success" (click)="goToCheckout()">Checkout</button>
                              </td>
                              
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
