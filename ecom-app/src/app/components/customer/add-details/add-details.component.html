<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Customer Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .card {
      border-radius: 15px;
    }

    h2,
    h3 {
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary {
      background-color: rgba(141, 68, 219, 1);
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      transition: all 0.3s ease-in-out;
    }

    .btn-primary:hover {
      background-color: rgba(116, 56, 186, 1);
      transform: translateY(-2px);
    }

    .form-control {
      border-radius: 10px;
    }

    label {
      font-weight: 600;
    }

    .alert {
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <section class="p-3 p-md-4 p-xl-5">
    <div class="container">
      <div class="card border-light shadow-sm p-4">
        <div class="row g-0">
          <div class="col-12">
            <div class="card-body p-3 p-md-4 p-xl-5">
              <div class="row text-center">
                <div class="col-12">
                  <div class="mb-5">
                    <h2 class="h3">Customer Registration</h2>
                    <h3 class="fs-6 fw-normal text-secondary m-0">
                      Please enter your details below
                    </h3>
                  </div>
                </div>
              </div>

              <div *ngIf="successMsg" class="alert alert-primary mb-4">
                {{ successMsg }}
              </div>
              <div *ngIf="errorMsg" class="alert alert-danger mb-4">
                {{ errorMsg }}
              </div>

              <!-- Reactive Form -->
              <form [formGroup]="customerForm" (ngSubmit)="onSignUp()">
                <div class="row">
                  <div class="col-lg-12 mb-4">
                    <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" formControlName="name"
                      placeholder="Enter your full name">
                    <span *ngIf="customerForm.controls['name'].touched && customerForm.controls['name'].invalid">
                      <small *ngIf="customerForm.controls['name'].errors?.['required']" class="text-danger">Name is
                        mandatory</small>
                    </span>
                  </div>

                  <div class="col-lg-12 mb-4">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" formControlName="email"
                      placeholder="Enter your email address">
                    <span *ngIf="customerForm.controls['email'].touched && customerForm.controls['email'].invalid">
                      <small *ngIf="customerForm.controls['email'].errors?.['required']" class="text-danger">Email is
                        mandatory</small>
                      <small *ngIf="customerForm.controls['email'].errors?.['email']" class="text-danger">Invalid email
                        format</small>
                    </span>
                  </div>

                  <div class="col-lg-12 mb-4">
                    <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="phoneNumber" formControlName="phoneNumber"
                      placeholder="Enter your phone number">
                    <span
                      *ngIf="customerForm.controls['phoneNumber'].touched && customerForm.controls['phoneNumber'].invalid">
                      <small *ngIf="customerForm.controls['phoneNumber'].errors?.['required']" class="text-danger">Phone
                        number is mandatory</small>
                      <small *ngIf="customerForm.controls['phoneNumber'].errors?.['pattern']"
                        class="text-danger">Invalid phone number</small>
                    </span>
                  </div>

                  <div class="col-12 d-flex justify-content-center mt-4">
                    <button class="btn btn-dark btn-lg" type="submit"
                      style="background-color: rgba(141, 68, 219, 1); border-color: white;"
                      [disabled]="customerForm.invalid">
                      Add details
                    </button>

                  </div>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
