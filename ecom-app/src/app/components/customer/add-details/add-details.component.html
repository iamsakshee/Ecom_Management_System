<form [formGroup]="customerForm" (ngSubmit)="onSignUp()" class="form-container">
  <div class="row">
    <!-- Customer Fields -->
    <div class="col-lg-12 mb-3">
      <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="name" formControlName="name" placeholder="Enter your full name">
      <span *ngIf="customerForm.controls['name'].touched && customerForm.controls['name'].invalid">
        <small *ngIf="customerForm.controls['name'].errors?.['required']" class="text-danger">Name is mandatory</small>
      </span>
    </div>

    <div class="col-lg-12 mb-3">
      <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
      <input type="email" class="form-control form-control-sm" id="email" formControlName="email" placeholder="Enter your email address">
      <span *ngIf="customerForm.controls['email'].touched && customerForm.controls['email'].invalid">
        <small *ngIf="customerForm.controls['email'].errors?.['required']" class="text-danger">Email is mandatory</small>
        <small *ngIf="customerForm.controls['email'].errors?.['email']" class="text-danger">Invalid email format</small>
      </span>
    </div>

    <div class="col-lg-12 mb-3">
      <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="phoneNumber" formControlName="phoneNumber" placeholder="Enter your phone number">
      <span *ngIf="customerForm.controls['phoneNumber'].touched && customerForm.controls['phoneNumber'].invalid">
        <small *ngIf="customerForm.controls['phoneNumber'].errors?.['required']" class="text-danger">Phone number is mandatory</small>
        <small *ngIf="customerForm.controls['phoneNumber'].errors?.['pattern']" class="text-danger">Invalid phone number</small>
      </span>
    </div>

    <!-- Shipping Address Fields -->
    <h3 class="mt-4" style="color: rgba(141, 68, 219, 1); font-size: 20px;">Shipping Address</h3>
    <div class="col-lg-12 mb-3">
      <label for="addressLine1" class="form-label">Address Line 1 <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="addressLine1" formControlName="addressLine1" placeholder="Enter address line 1">
    </div>

    <div class="col-lg-12 mb-3">
      <label for="addressLine2" class="form-label">Address Line 2</label>
      <input type="text" class="form-control form-control-sm" id="addressLine2" formControlName="addressLine2" placeholder="Enter address line 2">
    </div>

    <div class="col-lg-12 mb-3">
      <label for="city" class="form-label">City <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="city" formControlName="city" placeholder="Enter your city">
    </div>

    <div class="col-lg-12 mb-3">
      <label for="state" class="form-label">State <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="state" formControlName="state" placeholder="Enter your state">
    </div>

    <div class="col-lg-12 mb-3">
      <label for="country" class="form-label">Country <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="country" formControlName="country" placeholder="Enter your country">
    </div>

    <div class="col-lg-12 mb-3">
      <label for="zipCode" class="form-label">Zip Code <span class="text-danger">*</span></label>
      <input type="text" class="form-control form-control-sm" id="zipCode" formControlName="zipCode" placeholder="Enter your zip code">
    </div>

    <!-- Submit Button -->
    <div class="col-12 d-flex justify-content-center mt-4">
      <button class="btn" style="background-color: rgba(141, 68, 219, 1); color: white; padding: 8px 20px; font-size: 16px;" type="submit" [disabled]="customerForm.invalid">Add Details</button>
    </div>
  </div>
</form>
